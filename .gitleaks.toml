title = "EvolveMemory secret scan"

[extend]
useDefault = true

[[rules]]
id = "deepseek-api-key"
description = "DeepSeek-style API key"
regex = '''sk-[A-Za-z0-9]{24,}'''
entropy = 3.0
keywords = ["sk-"]

[allowlist]
description = "Deliberate fake credential used to prove the key never reaches logs"
paths = ['''tests/test_providers\.py''']
