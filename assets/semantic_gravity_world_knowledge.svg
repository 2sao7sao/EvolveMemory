<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EvolveMemory semantic gravity scoring</title>
  <desc id="desc">Code-derived diagram for SemanticGravityEngine.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4BAF98"/>
    </marker>
    <style>
      .bg { fill: #fbfffd; }
      .panel { fill: #ffffff; stroke: #d3e2dd; stroke-width: 1.5; }
      .green { fill: #effaf6; stroke: #b9dcd2; stroke-width: 1.5; }
      .blue { fill: #f0f7ff; stroke: #abc9ed; stroke-width: 1.5; }
      .gold { fill: #fff9ec; stroke: #e6cd8a; stroke-width: 1.5; }
      .text { fill: #17352f; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #647b74; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #23594f; font-family: "SFMono-Regular", Menlo, Consolas, ui-monospace, monospace; }
      .line { stroke: #4BAF98; stroke-width: 2; marker-end: url(#arrow); }
      .softline { stroke: #9bcfc2; stroke-width: 1.5; stroke-dasharray: 5 7; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="22" class="bg"/>
  <text x="56" y="66" class="text" font-size="32" font-weight="760">Semantic gravity keeps important context visible</text>
  <text x="56" y="94" class="muted" font-size="16">
    <tspan x="56" dy="0">Derived from memory_system/gravity.py: base gravity, cultural context, life-stage modifier,</tspan>
    <tspan x="56" dy="22">personal importance, and fatigue.</tspan>
  </text>

  <rect x="58" y="142" width="250" height="286" rx="18" class="panel"/>
  <text x="86" y="182" class="text" font-size="20" font-weight="720">Base gravity</text>
  <text x="86" y="218" class="mono" font-size="13">prepare_exam</text>
  <text x="230" y="218" class="muted" font-size="13">0.94</text>
  <text x="86" y="246" class="mono" font-size="13">health_constraint</text>
  <text x="230" y="246" class="muted" font-size="13">0.94</text>
  <text x="86" y="274" class="mono" font-size="13">between_jobs</text>
  <text x="230" y="274" class="muted" font-size="13">0.88</text>
  <text x="86" y="302" class="mono" font-size="13">prepare_interview</text>
  <text x="230" y="302" class="muted" font-size="13">0.86</text>
  <text x="86" y="330" class="mono" font-size="13">breakup</text>
  <text x="230" y="330" class="muted" font-size="13">0.82</text>
  <text x="86" y="362" class="muted" font-size="14">
    <tspan x="86" dy="0">Low lexical overlap can still rank</tspan>
    <tspan x="86" dy="22">high when the memory changes</tspan>
    <tspan x="86" dy="22">the safe or useful answer.</tspan>
  </text>

  <line x1="308" y1="286" x2="366" y2="286" class="line"/>

  <rect x="366" y="142" width="250" height="286" rx="18" class="green"/>
  <text x="394" y="182" class="text" font-size="20" font-weight="720">Context resolution</text>
  <text x="394" y="220" class="mono" font-size="13">if "gaokao" evidence:</text>
  <text x="414" y="246" class="muted" font-size="13">exam_month_hint = June</text>
  <text x="394" y="284" class="mono" font-size="13">if value in job states:</text>
  <text x="414" y="310" class="muted" font-size="13">context_weight = labor</text>
  <text x="414" y="334" class="muted" font-size="13">market sensitive</text>
  <text x="394" y="372" class="muted" font-size="14">
    <tspan x="394" dy="0">Returns ContextResolution with</tspan>
    <tspan x="394" dy="22">attributes and rationale.</tspan>
  </text>

  <line x1="616" y1="286" x2="674" y2="286" class="line"/>

  <rect x="674" y="142" width="250" height="286" rx="18" class="blue"/>
  <text x="702" y="182" class="text" font-size="20" font-weight="720">Social gravity</text>
  <text x="702" y="220" class="mono" font-size="13">G_social = base</text>
  <text x="702" y="246" class="mono" font-size="13">         * cultural_weight</text>
  <text x="702" y="272" class="mono" font-size="13">         * life_stage_modifier</text>
  <text x="702" y="316" class="muted" font-size="13">career context: 1.08</text>
  <text x="702" y="342" class="muted" font-size="13">exam context: 1.15</text>
  <text x="702" y="368" class="muted" font-size="13">interview/exam value: 1.10</text>

  <line x1="924" y1="286" x2="982" y2="286" class="line"/>

  <rect x="982" y="142" width="162" height="286" rx="18" class="gold"/>
  <text x="1010" y="182" class="text" font-size="20" font-weight="720">Final G</text>
  <text x="1010" y="222" class="mono" font-size="13">G_final</text>
  <text x="1010" y="248" class="mono" font-size="13">= G_social</text>
  <text x="1010" y="274" class="mono" font-size="13">* (1+aI)</text>
  <text x="1010" y="300" class="mono" font-size="13">/ (1+bF)</text>
  <text x="1010" y="344" class="muted" font-size="13">Returned as</text>
  <text x="1010" y="368" class="mono" font-size="13">ScoreBreakdown</text>

  <rect x="206" y="484" width="788" height="82" rx="18" class="panel"/>
  <text x="238" y="518" class="text" font-size="19" font-weight="720">Retrieval use</text>
  <text x="238" y="542" class="muted" font-size="15">
    <tspan x="238" dy="0">The retrieval-v3 factor G helps rank high-impact memories, but the memory-use gate still</tspan>
    <tspan x="238" dy="22">decides whether the memory may be mentioned, hidden, summarized, or suppressed.</tspan>
  </text>
  <path d="M1062 428 C1062 470 994 486 994 522" class="softline"/>
</svg>
