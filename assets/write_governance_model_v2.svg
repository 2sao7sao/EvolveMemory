<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Write governance model</title>
  <desc id="desc">Readable model for turning LLM proposals into create, review, merge, supersede, or reject decisions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker>
    <style>
      .bg{fill:#fff}.panel{fill:#f8fafc;stroke:#e5e7eb}.blue{fill:#eef4ff;stroke:#b8c7e6}.gold{fill:#fff7e6;stroke:#e5c36c}.red{fill:#fff1f0;stroke:#e7aaa3}.green{fill:#ecfdf3;stroke:#9bd2b3}.title{font:700 32px Inter,system-ui,sans-serif;fill:#111827}.h{font:700 18px Inter,system-ui,sans-serif;fill:#111827}.body{font:400 14px Inter,system-ui,sans-serif;fill:#475467}.mono{font:500 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2937}.math{font:500 16px Georgia,"Times New Roman",serif;fill:#1f2937}.sub{font-size:70%;baseline-shift:sub}.line{stroke:#111827;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" class="bg"/>
  <text x="56" y="72" class="title">LLM output is a proposal, not a write</text>
  <text x="56" y="104" class="body">Validation and write governance decide whether a candidate can become a durable record.</text>

  <rect x="56" y="150" width="270" height="178" rx="18" class="blue"/>
  <text x="88" y="190" class="h">Proposal boundary</text>
  <text x="88" y="228" class="mono">candidate_memories[]</text>
  <text x="88" y="258" class="mono">source_turn_ids</text>
  <text x="88" y="288" class="mono">evidence metadata</text>

  <line x1="326" y1="239" x2="390" y2="239" class="line"/>
  <rect x="390" y="150" width="330" height="178" rx="18" class="gold"/>
  <text x="422" y="190" class="h">Weighted score</text>
  <text x="422" y="228" class="math">S<tspan class="sub">write</tspan> = clamp(Σ w<tspan class="sub">i</tspan> f<tspan class="sub">i</tspan>)</text>
  <text x="422" y="258" class="math">f<tspan class="sub">i</tspan>: confidence, reuse, stability</text>
  <text x="422" y="288" class="math">evidence, novelty, privacy</text>

  <line x1="720" y1="239" x2="784" y2="239" class="line"/>
  <rect x="784" y="150" width="360" height="178" rx="18" class="red"/>
  <text x="816" y="190" class="h">Hard policy overrides</text>
  <text x="816" y="228" class="mono">settings disabled -> reject</text>
  <text x="816" y="258" class="mono">restricted -> consent</text>
  <text x="816" y="288" class="mono">duplicate -> merge evidence</text>

  <rect x="56" y="376" width="1088" height="98" rx="18" class="green"/>
  <text x="88" y="414" class="h">Decision paths</text>
  <text x="88" y="448" class="mono">create</text>
  <text x="250" y="448" class="mono">review</text>
  <text x="412" y="448" class="mono">merge</text>
  <text x="574" y="448" class="mono">supersede</text>
  <text x="776" y="448" class="mono">reject</text>
</svg>
