<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Activation and temporal anomaly model</title>
  <desc id="desc">Readable formula card for memory activation, temporal anomaly, and phase output.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.panel{fill:#f8fafc;stroke:#e5e7eb}.formula{fill:#eef4ff;stroke:#b8c7e6}.warn{fill:#fff7e6;stroke:#e5c36c}.state{fill:#ecfdf3;stroke:#9bd2b3}.title{font:700 32px Inter,system-ui,sans-serif;fill:#111827}.h{font:700 18px Inter,system-ui,sans-serif;fill:#111827}.body{font:400 14px Inter,system-ui,sans-serif;fill:#475467}.mono{font:500 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1f2937}.small{font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#344054}.rule{stroke:#d0d5dd}
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" class="bg"/>
  <text x="56" y="72" class="title">Activation is lifecycle, not recency</text>
  <text x="56" y="104" class="body">A memory can be stored but inactive. Activation combines confidence, age, recurrence, anomaly, and fatigue.</text>

  <rect x="56" y="136" width="620" height="220" rx="18" class="formula"/>
  <text x="88" y="176" class="h">Activation score</text>
  <text x="88" y="216" class="mono">log_A = base[lifecycle]</text>
  <text x="88" y="246" class="mono">      + log(confidence)</text>
  <text x="88" y="276" class="mono">      - decay * age_days</text>
  <text x="88" y="306" class="mono">      + recurrence_boost + anomaly_boost</text>
  <text x="88" y="336" class="mono">      - fatigue_penalty</text>

  <rect x="724" y="136" width="420" height="220" rx="18" class="warn"/>
  <text x="756" y="176" class="h">Temporal anomaly</text>
  <text x="756" y="216" class="mono">z = 0.50 * duration_ratio</text>
  <text x="756" y="246" class="mono">  + 0.30 * recurrence</text>
  <text x="756" y="276" class="mono">  + 0.20 * severity</text>
  <text x="756" y="320" class="body">Persistent volatile states stay visible for review or careful follow-up.</text>

  <rect x="56" y="396" width="1088" height="110" rx="18" class="state"/>
  <text x="88" y="434" class="h">Output phases</text>
  <line x1="88" y1="452" x2="1112" y2="452" class="rule"/>
  <text x="88" y="482" class="small">active</text>
  <text x="286" y="482" class="small">extended</text>
  <text x="504" y="482" class="small">anomalous</text>
  <text x="742" y="482" class="small">escalated</text>
  <text x="930" y="482" class="small">A = sigmoid(log_A)</text>
</svg>
