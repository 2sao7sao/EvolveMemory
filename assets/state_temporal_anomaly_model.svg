<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EvolveMemory activation and temporal anomaly model</title>
  <desc id="desc">Code-derived diagram for StateTemporalAnomalyDetector and ActivationEngine.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4BAF98"/>
    </marker>
    <style>
      .bg { fill: #fbfffd; }
      .panel { fill: #ffffff; stroke: #cfe0da; stroke-width: 1.5; }
      .soft { fill: #f1faf7; stroke: #b8dcd1; stroke-width: 1.5; }
      .blue { fill: #f1f7ff; stroke: #aac9ec; stroke-width: 1.5; }
      .warn { fill: #fff8ea; stroke: #e3c984; stroke-width: 1.5; }
      .risk { fill: #fff1ef; stroke: #e4b2aa; stroke-width: 1.5; }
      .text { fill: #17352f; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #637a73; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #23594f; font-family: "SFMono-Regular", Menlo, Consolas, ui-monospace, monospace; }
      .line { stroke: #4BAF98; stroke-width: 2; marker-end: url(#arrow); }
      .thin { stroke: #9bcfc2; stroke-width: 1.5; stroke-dasharray: 5 7; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="22" class="bg"/>
  <text x="56" y="66" class="text" font-size="32" font-weight="760">Activation is not just recency</text>
  <text x="56" y="96" class="muted" font-size="16">Derived from memory_system/activation.py: lifecycle decay, recurrence, anomaly boost, and fatigue penalty.</text>

  <rect x="56" y="134" width="230" height="164" rx="16" class="panel"/>
  <text x="84" y="172" class="text" font-size="20" font-weight="720">MemoryItem</text>
  <text x="84" y="204" class="mono" font-size="14">key</text>
  <text x="152" y="204" class="muted" font-size="14">current_emotional_state</text>
  <text x="84" y="230" class="mono" font-size="14">value</text>
  <text x="152" y="230" class="muted" font-size="14">anxious</text>
  <text x="84" y="256" class="mono" font-size="14">dynamics</text>
  <text x="152" y="256" class="muted" font-size="14">fluid</text>

  <line x1="286" y1="216" x2="340" y2="216" class="line"/>

  <rect x="340" y="118" width="250" height="196" rx="16" class="soft"/>
  <text x="370" y="156" class="text" font-size="20" font-weight="720">TTL resolver</text>
  <text x="370" y="188" class="mono" font-size="13">TTL_BY_VALUE</text>
  <text x="370" y="214" class="muted" font-size="14">anxious: 3..21 days</text>
  <text x="370" y="240" class="muted" font-size="14">busy: 1..14 days</text>
  <text x="370" y="266" class="muted" font-size="14">between_jobs: 30..180 days</text>
  <text x="370" y="292" class="muted" font-size="14">prepare_interview: 7..45 days</text>

  <line x1="590" y1="216" x2="644" y2="216" class="line"/>

  <rect x="644" y="118" width="250" height="196" rx="16" class="warn"/>
  <text x="674" y="156" class="text" font-size="20" font-weight="720">Anomaly score</text>
  <text x="674" y="190" class="mono" font-size="13">0.5 * duration_ratio</text>
  <text x="674" y="216" class="mono" font-size="13">+ 0.3 * recurrence_factor</text>
  <text x="674" y="242" class="mono" font-size="13">+ 0.2 * severity_prior</text>
  <text x="674" y="278" class="muted" font-size="14">Output: z_anom for activation</text>

  <line x1="894" y1="216" x2="948" y2="216" class="line"/>

  <rect x="948" y="118" width="196" height="196" rx="16" class="panel"/>
  <text x="976" y="156" class="text" font-size="20" font-weight="720">Phase</text>
  <text x="976" y="190" class="mono" font-size="14">active</text>
  <text x="976" y="218" class="mono" font-size="14">extended</text>
  <text x="976" y="246" class="mono" font-size="14">anomalous</text>
  <text x="976" y="274" class="mono" font-size="14">escalated</text>

  <rect x="156" y="394" width="888" height="142" rx="18" class="blue"/>
  <text x="190" y="436" class="text" font-size="21" font-weight="760">ActivationEngine.score()</text>
  <text x="190" y="474" class="mono" font-size="17">log_A = alpha_l + log(confidence) - lambda_l * age_days + rho * log(1 + recurrence)</text>
  <text x="190" y="506" class="mono" font-size="17">        + omega * anomaly - eta * fatigue</text>
  <text x="190" y="536" class="muted" font-size="14">The retrieval factor A is logistic(log_A), returned as ScoreBreakdown(name="activation").</text>

  <path d="M769 314 C769 354 600 350 600 394" class="thin"/>
  <path d="M1046 314 C1046 354 800 350 800 394" class="thin"/>

  <rect x="156" y="558" width="888" height="34" rx="10" class="risk"/>
  <text x="182" y="580" class="muted" font-size="14">Purpose: a stale memory decays; a persistent or recurring volatile state can be boosted for review or careful follow-up, while fatigue lowers repeated surfacing.</text>
</svg>
