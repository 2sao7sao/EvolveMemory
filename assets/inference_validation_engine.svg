<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EvolveMemory proposal validation and write governance</title>
  <desc id="desc">Code-derived diagram for provider-free LLM proposal ingest, schema validation, weighted write governance, and normalized persistence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4BAF98"/>
    </marker>
    <style>
      .bg { fill: #fbfffd; }
      .panel { fill: #ffffff; stroke: #d2e1dc; stroke-width: 1.5; }
      .green { fill: #effaf6; stroke: #b9dcd2; stroke-width: 1.5; }
      .blue { fill: #f1f7ff; stroke: #afcaea; stroke-width: 1.5; }
      .gold { fill: #fff8ea; stroke: #e5cb88; stroke-width: 1.5; }
      .red { fill: #fff1ef; stroke: #e4b2aa; stroke-width: 1.5; }
      .text { fill: #17352f; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #647b74; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #23594f; font-family: "SFMono-Regular", Menlo, Consolas, ui-monospace, monospace; }
      .line { stroke: #4BAF98; stroke-width: 2; marker-end: url(#arrow); }
      .thin { stroke: #9bcfc2; stroke-width: 1.5; stroke-dasharray: 5 7; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="22" class="bg"/>
  <text x="56" y="66" class="text" font-size="32" font-weight="760">LLM output is a proposal, not a write</text>
  <text x="56" y="96" class="muted" font-size="16">Derived from extraction.py, writing.py, persistence.py, and app.py v2 ingest.</text>

  <rect x="56" y="136" width="218" height="158" rx="16" class="panel"/>
  <text x="84" y="174" class="text" font-size="20" font-weight="720">Input boundary</text>
  <text x="84" y="208" class="mono" font-size="13">extractor="llm_payload"</text>
  <text x="84" y="236" class="muted" font-size="14">candidate_memories[]</text>
  <text x="84" y="262" class="muted" font-size="14">turn text hash + source turn</text>

  <line x1="274" y1="215" x2="326" y2="215" class="line"/>

  <rect x="326" y="118" width="236" height="194" rx="16" class="blue"/>
  <text x="354" y="156" class="text" font-size="20" font-weight="720">Schema validation</text>
  <text x="354" y="190" class="mono" font-size="13">LLMProposalSchemaValidator</text>
  <text x="354" y="222" class="muted" font-size="14">repair legacy payloads</text>
  <text x="354" y="248" class="muted" font-size="14">reject blank tags</text>
  <text x="354" y="274" class="muted" font-size="14">reject third-party confusion</text>

  <line x1="562" y1="215" x2="614" y2="215" class="line"/>

  <rect x="614" y="118" width="236" height="194" rx="16" class="green"/>
  <text x="642" y="156" class="text" font-size="20" font-weight="720">Record proposal</text>
  <text x="642" y="190" class="mono" font-size="13">MemoryRecord</text>
  <text x="642" y="222" class="muted" font-size="14">layer, key, normalized_value</text>
  <text x="642" y="248" class="muted" font-size="14">authority, sensitivity</text>
  <text x="642" y="274" class="muted" font-size="14">source_turn_ids, metadata</text>

  <line x1="850" y1="215" x2="902" y2="215" class="line"/>

  <rect x="902" y="102" width="242" height="226" rx="16" class="gold"/>
  <text x="930" y="140" class="text" font-size="20" font-weight="720">Write governance</text>
  <text x="930" y="174" class="mono" font-size="13">WeightedWriteEvaluatorV2</text>
  <text x="930" y="210" class="mono" font-size="13">S_write = factors</text>
  <text x="930" y="238" class="muted" font-size="14">settings + contradictions</text>
  <text x="930" y="264" class="muted" font-size="14">sensitivity review</text>
  <text x="930" y="292" class="muted" font-size="14">do-not-remember wins</text>

  <rect x="178" y="400" width="844" height="74" rx="18" class="panel"/>
  <text x="210" y="430" class="text" font-size="19" font-weight="720">Write score factors</text>
  <text x="210" y="454" class="mono" font-size="14">
    <tspan x="210" dy="0">confidence, future_reuse, personalization_gain, stability, user_authority,</tspan>
    <tspan x="210" dy="20">evidence_quality, novelty, actionability, privacy_adjustment</tspan>
  </text>

  <path d="M1023 328 C1023 364 600 362 600 400" class="thin"/>

  <rect x="178" y="516" width="152" height="50" rx="14" class="green"/>
  <text x="214" y="547" class="mono" font-size="15">create</text>
  <rect x="356" y="516" width="152" height="50" rx="14" class="blue"/>
  <text x="394" y="547" class="mono" font-size="15">merge</text>
  <rect x="534" y="516" width="152" height="50" rx="14" class="gold"/>
  <text x="568" y="547" class="mono" font-size="15">review</text>
  <rect x="712" y="516" width="152" height="50" rx="14" class="red"/>
  <text x="750" y="547" class="mono" font-size="15">reject</text>
  <rect x="890" y="516" width="152" height="50" rx="14" class="panel"/>
  <text x="918" y="547" class="mono" font-size="15">supersede</text>

  <line x1="600" y1="474" x2="254" y2="516" class="thin"/>
  <line x1="600" y1="474" x2="432" y2="516" class="thin"/>
  <line x1="600" y1="474" x2="610" y2="516" class="thin"/>
  <line x1="600" y1="474" x2="788" y2="516" class="thin"/>
  <line x1="600" y1="474" x2="966" y2="516" class="thin"/>
</svg>
