<svg width="1400" height="880" viewBox="0 0 1400 880" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EvolveMemory runtime contract map</title>
  <desc id="desc">Layered runtime contract map showing write path, retrieval path, prompt path, and correction loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#111827"/>
    </marker>
    <marker id="softArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#8B8FA3"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f2937" flood-opacity="0.08"/>
    </filter>
    <style>
      .bg { fill: #f7f8fa; }
      .paper { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
      .lane-write { fill: #f4ecd6; }
      .lane-rank { fill: #dceeb1; }
      .lane-use { fill: #c8e6cd; }
      .lane-audit { fill: #efd4d4; }
      .card { fill: #ffffff; stroke: #d9dde5; stroke-width: 1.2; }
      .card-strong { fill: #ffffff; stroke: #111827; stroke-width: 1.4; }
      .chip { fill: #111827; }
      .chip-soft { fill: #eef0f6; stroke: #d9dde5; stroke-width: 1; }
      .title { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 760; }
      .text { fill: #111827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #667085; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #344054; font-family: "SFMono-Regular", Menlo, Consolas, ui-monospace, monospace; }
      .white { fill: #ffffff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { stroke: #111827; stroke-width: 2.2; marker-end: url(#arrow); }
      .softLine { stroke: #8B8FA3; stroke-width: 1.6; stroke-dasharray: 7 8; marker-end: url(#softArrow); }
      .rule { stroke: #d0d5dd; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1400" height="880" rx="28" class="bg"/>
  <rect x="48" y="44" width="1304" height="792" rx="26" class="paper" filter="url(#softShadow)"/>

  <text x="92" y="104" class="title" font-size="34">Runtime contract map</text>
  <text x="92" y="136" class="muted" font-size="16">
    <tspan x="92" dy="0">A memory is proposed, governed, stored, ranked, permitted, compiled, and audited.</tspan>
    <tspan x="92" dy="22">Retrieval ranks candidates; the gate decides whether and how memory can affect the prompt.</tspan>
  </text>

  <rect x="984" y="82" width="110" height="34" rx="17" class="chip"/>
  <text x="1014" y="104" class="white" font-size="13" font-weight="700">rank</text>
  <rect x="1106" y="82" width="118" height="34" rx="17" class="chip-soft"/>
  <text x="1134" y="104" class="muted" font-size="13" font-weight="700">permit</text>
  <rect x="1236" y="82" width="74" height="34" rx="17" class="chip-soft"/>
  <text x="1261" y="104" class="muted" font-size="13" font-weight="700">audit</text>

  <line x1="92" y1="176" x2="1308" y2="176" class="rule"/>

  <!-- Lane 1 -->
  <rect x="92" y="214" width="1216" height="146" rx="20" class="lane-write"/>
  <text x="124" y="252" class="title" font-size="17">01 Write path</text>
  <text x="124" y="280" class="muted" font-size="13">Governed records only.</text>

  <rect x="314" y="238" width="190" height="92" rx="14" class="card"/>
  <text x="336" y="268" class="muted" font-size="12" font-weight="700">INPUT</text>
  <text x="336" y="294" class="text" font-size="20" font-weight="750">Turn</text>
  <text x="336" y="316" class="mono" font-size="12">TurnPrep + command</text>

  <line x1="504" y1="284" x2="548" y2="284" class="line"/>

  <rect x="548" y="238" width="190" height="92" rx="14" class="card"/>
  <text x="570" y="268" class="muted" font-size="12" font-weight="700">PROPOSE</text>
  <text x="570" y="294" class="text" font-size="20" font-weight="750">Candidate</text>
  <text x="570" y="316" class="mono" font-size="12">MemoryRecord[]</text>

  <line x1="738" y1="284" x2="782" y2="284" class="line"/>

  <rect x="782" y="238" width="190" height="92" rx="14" class="card-strong"/>
  <text x="804" y="268" class="muted" font-size="12" font-weight="700">GOVERN</text>
  <text x="804" y="294" class="text" font-size="20" font-weight="750">Write policy</text>
  <text x="804" y="316" class="mono" font-size="12">create / review</text>

  <line x1="972" y1="284" x2="1016" y2="284" class="line"/>

  <rect x="1016" y="238" width="190" height="92" rx="14" class="card"/>
  <text x="1038" y="268" class="muted" font-size="12" font-weight="700">PERSIST</text>
  <text x="1038" y="294" class="text" font-size="20" font-weight="750">Store</text>
  <text x="1038" y="316" class="mono" font-size="12">records + events</text>

  <!-- Lane 2 -->
  <rect x="92" y="392" width="1216" height="146" rx="20" class="lane-rank"/>
  <text x="124" y="430" class="title" font-size="17">02 Retrieval path</text>
  <text x="124" y="456" class="muted" font-size="13">
    <tspan x="124" dy="0">Score candidates.</tspan>
    <tspan x="124" dy="18">Then gate usage.</tspan>
  </text>

  <rect x="314" y="416" width="190" height="92" rx="14" class="card"/>
  <text x="336" y="446" class="muted" font-size="12" font-weight="700">QUERY</text>
  <text x="336" y="472" class="text" font-size="20" font-weight="750">Intent plan</text>
  <text x="336" y="494" class="mono" font-size="12">layers + modes</text>

  <line x1="504" y1="462" x2="548" y2="462" class="line"/>

  <rect x="548" y="416" width="190" height="92" rx="14" class="card-strong"/>
  <text x="570" y="446" class="muted" font-size="12" font-weight="700">SCORE</text>
  <text x="570" y="472" class="text" font-size="20" font-weight="750">Retrieval v3</text>
  <text x="570" y="494" class="mono" font-size="12">K E F L A C G</text>

  <line x1="738" y1="462" x2="782" y2="462" class="line"/>

  <rect x="782" y="416" width="190" height="92" rx="14" class="card-strong"/>
  <text x="804" y="446" class="muted" font-size="12" font-weight="700">PERMIT</text>
  <text x="804" y="472" class="text" font-size="20" font-weight="750">Use gate</text>
  <text x="804" y="494" class="mono" font-size="12">action + visibility</text>

  <line x1="972" y1="462" x2="1016" y2="462" class="line"/>

  <rect x="1016" y="416" width="190" height="92" rx="14" class="card"/>
  <text x="1038" y="446" class="muted" font-size="12" font-weight="700">OUTPUT</text>
  <text x="1038" y="472" class="text" font-size="20" font-weight="750">Allowed uses</text>
  <text x="1038" y="494" class="mono" font-size="12">direct / style / suppress</text>

  <!-- Lane 3 -->
  <rect x="92" y="570" width="1216" height="146" rx="20" class="lane-use"/>
  <text x="124" y="608" class="title" font-size="17">03 Prompt path</text>
  <text x="124" y="636" class="muted" font-size="13">Prompt-safe sections.</text>

  <rect x="314" y="594" width="190" height="92" rx="14" class="card"/>
  <text x="336" y="624" class="muted" font-size="12" font-weight="700">COMPILE</text>
  <text x="336" y="650" class="text" font-size="20" font-weight="750">Prompt context</text>
  <text x="336" y="672" class="mono" font-size="12">safe sections</text>

  <line x1="504" y1="640" x2="548" y2="640" class="line"/>

  <rect x="548" y="594" width="190" height="92" rx="14" class="card"/>
  <text x="570" y="624" class="muted" font-size="12" font-weight="700">POLICY</text>
  <text x="570" y="650" class="text" font-size="20" font-weight="750">Response</text>
  <text x="570" y="672" class="mono" font-size="12">tone + structure</text>

  <line x1="738" y1="640" x2="782" y2="640" class="line"/>

  <rect x="782" y="594" width="190" height="92" rx="14" class="card"/>
  <text x="804" y="624" class="muted" font-size="12" font-weight="700">MODEL</text>
  <text x="804" y="650" class="text" font-size="20" font-weight="750">Answer</text>
  <text x="804" y="672" class="mono" font-size="12">no raw leakage</text>

  <rect x="1016" y="594" width="190" height="92" rx="14" class="card"/>
  <text x="1038" y="624" class="muted" font-size="12" font-weight="700">AUDIT</text>
  <text x="1038" y="650" class="text" font-size="20" font-weight="750">Corrections</text>
  <text x="1038" y="672" class="mono" font-size="12">retire / delete</text>

  <path d="M1111 594 C1111 560 1111 544 1111 508" class="softLine"/>
  <path d="M877 416 C877 382 877 364 877 330" class="softLine"/>
  <path d="M1111 330 C1111 360 1111 382 1111 416" class="softLine"/>
  <path d="M1206 640 H1258 V284 H1206" class="softLine"/>

  <rect x="92" y="748" width="1216" height="50" rx="16" class="lane-audit"/>
  <text x="124" y="780" class="title" font-size="15">Invariant</text>
  <text x="226" y="770" class="muted" font-size="14">
    <tspan x="226" dy="0">A retrieved memory is only a candidate. It must pass the use gate before it can become direct fact, style policy,</tspan>
    <tspan x="226" dy="20">follow-up cue, hidden constraint, summary, or suppression.</tspan>
  </text>
</svg>
