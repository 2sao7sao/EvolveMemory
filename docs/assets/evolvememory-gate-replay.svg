<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EvolveMemory replay proof</title>
  <desc id="desc">Code-derived replay proof showing two queries, memory-use gate actions, prompt-safe channels, and correction retirement.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4BAF98"/>
    </marker>
    <style>
      .bg { fill: #fbfffd; }
      .panel { fill: #ffffff; stroke: #d2e1dc; stroke-width: 1.5; }
      .green { fill: #effaf6; stroke: #b9dcd2; stroke-width: 1.5; }
      .blue { fill: #f1f7ff; stroke: #afcaea; stroke-width: 1.5; }
      .gold { fill: #fff8ea; stroke: #e5cb88; stroke-width: 1.5; }
      .red { fill: #fff1ef; stroke: #e4b2aa; stroke-width: 1.5; }
      .text { fill: #17352f; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #647b74; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #23594f; font-family: "SFMono-Regular", Menlo, Consolas, ui-monospace, monospace; }
      .line { stroke: #4BAF98; stroke-width: 2; marker-end: url(#arrow); }
      .softline { stroke: #9bcfc2; stroke-width: 1.5; stroke-dasharray: 5 7; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="22" class="bg"/>
  <text x="56" y="64" class="text" font-size="32" font-weight="760">Replay proof: retrieval is controlled behavior</text>
  <text x="56" y="94" class="muted" font-size="16">Derived from memory_system/demo.py and evals.runner.run_product_replay_eval().</text>

  <rect x="56" y="130" width="260" height="154" rx="18" class="panel"/>
  <text x="86" y="168" class="text" font-size="20" font-weight="720">Stored turns</text>
  <text x="86" y="206" class="mono" font-size="13">life_event: prepare_interview</text>
  <text x="86" y="232" class="mono" font-size="13">current_emotional_state: anxious</text>
  <text x="86" y="258" class="mono" font-size="13">communication_style: direct</text>

  <line x1="316" y1="207" x2="372" y2="207" class="line"/>

  <rect x="372" y="118" width="226" height="178" rx="18" class="blue"/>
  <text x="400" y="156" class="text" font-size="20" font-weight="720">Query A</text>
  <text x="400" y="190" class="muted" font-size="14">Interview preparation</text>
  <text x="400" y="228" class="mono" font-size="13">life_event -> follow_up</text>
  <text x="400" y="254" class="mono" font-size="13">style -> style_only</text>
  <text x="400" y="280" class="mono" font-size="13">emotion -> policy_only</text>

  <line x1="598" y1="207" x2="654" y2="207" class="line"/>

  <rect x="654" y="118" width="226" height="178" rx="18" class="green"/>
  <text x="682" y="156" class="text" font-size="20" font-weight="720">Prompt channels</text>
  <text x="682" y="192" class="mono" font-size="13">event_followups</text>
  <text x="682" y="218" class="mono" font-size="13">style_policy</text>
  <text x="682" y="244" class="mono" font-size="13">direct_facts: safe only</text>
  <text x="682" y="270" class="mono" font-size="13">suppressed_count</text>

  <rect x="934" y="118" width="210" height="178" rx="18" class="gold"/>
  <text x="962" y="156" class="text" font-size="20" font-weight="720">Eval metrics</text>
  <text x="962" y="194" class="mono" font-size="13">gate_action_accuracy 1.0</text>
  <text x="962" y="220" class="mono" font-size="13">style_continuity 1.0</text>
  <text x="962" y="246" class="mono" font-size="13">prompt_safety 1.0</text>
  <text x="962" y="272" class="mono" font-size="13">correction_retirement 1.0</text>

  <rect x="372" y="356" width="226" height="132" rx="18" class="red"/>
  <text x="400" y="394" class="text" font-size="20" font-weight="720">Query B</text>
  <text x="400" y="428" class="muted" font-size="14">Code review, do not mention interview</text>
  <text x="400" y="462" class="mono" font-size="13">life_event -> suppress</text>

  <rect x="654" y="356" width="226" height="132" rx="18" class="panel"/>
  <text x="682" y="394" class="text" font-size="20" font-weight="720">Correction</text>
  <text x="682" y="428" class="muted" font-size="14">User rejects anxiety memory</text>
  <text x="682" y="462" class="mono" font-size="13">state + profile retired</text>

  <line x1="485" y1="296" x2="485" y2="356" class="softline"/>
  <line x1="767" y1="296" x2="767" y2="356" class="softline"/>
  <line x1="880" y1="207" x2="934" y2="207" class="line"/>

  <rect x="56" y="368" width="260" height="92" rx="18" class="green"/>
  <text x="86" y="404" class="text" font-size="20" font-weight="720">Invariant</text>
  <text x="86" y="436" class="muted" font-size="14">A retrieved memory is useful only after gate action and prompt-channel assignment.</text>
</svg>
